aid: cardiac-dimensions
name: Cardiac Dimensions
description: 'Cardiac Dimensions is a privately held structural-heart medical device
  company headquartered in Kirkland, Washington, developing transcatheter therapies
  for patients with heart failure and functional mitral regurgitation. Its lead product
  is the CARILLON Mitral Contour System, a minimally invasive, catheter-delivered
  implant placed in the coronary sinus to reshape the mitral valve annulus and reduce
  functional mitral regurgitation without open-heart surgery. CARILLON carries a CE
  Mark in Europe and remains an investigational device in the United States, where
  the company is completing the EMPOWER pivotal trial. Cardiac Dimensions closed an
  oversubscribed $53M Series E in March 2025 led by Ally Bridge Group. The company
  manufactures an implantable Class III medical device and operates no public developer
  program, API, or software platform.'
